<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" font-family="Helvetica, Arial, sans-serif">
  <rect width="1300" height="760" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>
    </marker>
  </defs>

  <text x="40" y="40" font-size="20" fill="#1a1a1a">User–Notification Microservices System</text>

  <!-- Client -->
  <rect x="40" y="90" width="140" height="50" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="110" y="120" font-size="14" fill="#1a1a1a" text-anchor="middle">Client</text>

  <!-- Gateway -->
  <rect x="240" y="90" width="180" height="50" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="330" y="120" font-size="14" fill="#1a1a1a" text-anchor="middle">API Gateway</text>

  <line x1="180" y1="115" x2="238" y2="115" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="209" y="105" font-size="11" fill="#555" text-anchor="middle">prompt</text>

  <!-- User Service -->
  <rect x="90" y="220" width="220" height="70" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="200" y="248" font-size="14" fill="#1a1a1a" text-anchor="middle">User Service</text>
  <text x="200" y="266" font-size="11" fill="#555" text-anchor="middle">Controller -&gt; Service -&gt; Outbox</text>

  <!-- Notification Service -->
  <rect x="440" y="220" width="240" height="70" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="560" y="248" font-size="14" fill="#1a1a1a" text-anchor="middle">Notification Service</text>
  <text x="560" y="266" font-size="11" fill="#555" text-anchor="middle">Durable pull consumer</text>

  <path d="M330 140 V180 H200 V218" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="215" y="176" font-size="11" fill="#555">POST /api/users/**</text>

  <path d="M330 140 V180 H560 V218" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="565" y="176" font-size="11" fill="#555">/api/notifications/**</text>

  <!-- User DB -->
  <rect x="60" y="340" width="150" height="46" rx="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="135" y="368" font-size="12" fill="#1a1a1a" text-anchor="middle">user_db (Postgres)</text>
  <line x1="150" y1="290" x2="150" y2="338" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Notification DB -->
  <rect x="470" y="340" width="200" height="46" rx="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="570" y="368" font-size="12" fill="#1a1a1a" text-anchor="middle">notification_db (Postgres)</text>
  <line x1="570" y1="290" x2="570" y2="338" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Outbox relay -->
  <text x="200" y="308" font-size="11" fill="#555" text-anchor="middle">save User + Outbox row (1 txn)</text>

  <!-- NATS JetStream -->
  <rect x="80" y="470" width="600" height="120" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="110" y="495" font-size="14" fill="#1a1a1a">NATS JetStream</text>
  <text x="110" y="516" font-size="11" fill="#555">Stream: USER_EVENTS   |   Subjects: user.events.&gt;</text>
  <text x="110" y="534" font-size="11" fill="#555">Durable consumer: notification-service-durable</text>
  <text x="110" y="552" font-size="11" fill="#555">DLQ subject: user.events.dlq</text>

  <!-- outbox relay scheduled box -->
  <rect x="70" y="410" width="220" height="40" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="180" y="434" font-size="12" fill="#1a1a1a" text-anchor="middle">OutboxRelayService (scheduled)</text>
  <line x1="180" y1="386" x2="180" y2="408" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="180" y1="450" x2="220" y2="468" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="230" y="462" font-size="11" fill="#555">publish (ack required)</text>

  <!-- listener box -->
  <rect x="530" y="410" width="220" height="40" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="640" y="434" font-size="12" fill="#1a1a1a" text-anchor="middle">UserEventListener (pull)</text>
  <path d="M580 470 V450" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="600" y="462" font-size="11" fill="#555">fetch + ack/nak</text>

  <path d="M560 290 V330 H640 V408" fill="none" stroke="#1a1a1a" stroke-width="1.3"/>

  <!-- Idempotency note -->
  <rect x="740" y="470" width="220" height="120" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="850" y="494" font-size="12" fill="#1a1a1a" text-anchor="middle">notification_logs</text>
  <text x="850" y="516" font-size="11" fill="#555" text-anchor="middle">unique(eventId)</text>
  <text x="850" y="534" font-size="11" fill="#555" text-anchor="middle">= idempotency check</text>
  <text x="850" y="552" font-size="11" fill="#555" text-anchor="middle">status: SENT / FAILED /</text>
  <text x="850" y="568" font-size="11" fill="#555" text-anchor="middle">DUPLICATE_SKIPPED</text>
  <line x1="738" y1="520" x2="682" y2="500" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Notification sender -->
  <rect x="740" y="330" width="220" height="60" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3"/>
  <text x="850" y="355" font-size="12" fill="#1a1a1a" text-anchor="middle">NotificationSender</text>
  <text x="850" y="373" font-size="11" fill="#555" text-anchor="middle">LOG (dev) or EMAIL (SMTP)</text>
  <line x1="850" y1="468" x2="850" y2="392" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <text x="40" y="650" font-size="12" fill="#1a1a1a">Legend</text>
  <line x1="40" y1="668" x2="80" y2="668" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="90" y="672" font-size="11" fill="#555">synchronous HTTP call</text>
  <rect x="260" y="656" width="20" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="290" y="670" font-size="11" fill="#555">NATS JetStream (async, only link between the two services)</text>

  <text x="40" y="710" font-size="11" fill="#888">User Service and Notification Service never call each other directly — the only integration surface is the event contract on NATS.</text>
</svg>
